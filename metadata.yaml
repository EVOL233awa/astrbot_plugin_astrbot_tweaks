name: astrbot_plugin_astrbot_tweaks
display_name: Astrbot Tweaks
short_desc: 将 AstrBot 上下文压缩、提示词、LLM 参数透传与 SubAgent 直通做成可配置开关。
desc: |
  运行时 tweak 插件，不修改 AstrBot 本体源码。
  支持独立开关：上下文压缩策略、移除官方英文 Computer Use 提示、精简技能规则、
  OpenAI-compatible temperature/max_tokens 透传，以及 SubAgent 白名单工具直通。
  插件卸载或重载时恢复原始行为；AstrBot 版本或 API 不兼容时自动降级并保持插件可加载。
version: v0.2.1
author: EvoidNGC
repo: https://github.com/EVOL233awa/astrbot_plugin_astrbot_tweaks
astrbot_version: ">=4.27,<5"
social_link: https://github.com/EVOL233awa
