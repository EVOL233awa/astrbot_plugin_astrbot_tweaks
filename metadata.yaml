  运行时 tweak 插件，不修改 AstrBot 本体源码。
  插件将上下文压缩、提示词、响应可靠性、LLM 参数透传与工具直通等多项 AstrBot 行为调整拆分为独立开关，卸载或重载时恢复原始方法。
